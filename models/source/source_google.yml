    database: DB21_BRONZE_DB # this is the name of our database 

    quoting:
      database: false
      schema: false
      identifier: false 
 

    tables:
    
      - name: GOOGLE_SHEET 
        columns:
          - name: _row
          - name: product_id
          - name: quantity
          - name: month
          - name: _fivetran_synced

      - name: USERS 
        columns:
          - name: Nombre
          - name: DNI
          - name: email
          - name: fecha_alta_sistema